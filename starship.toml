# starship.toml
# @author deng
# since 2024 2025 2026

add_newline = false
follow_symlinks = false

# [➔](bold green) \
# $cmd_duration \

format = """
$os\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$all\
$character\
"""

# right_format = """
# """

# [line_break]
# disabled = true

[os]
disabled = false
format = '[$symbol]($style)'

# [username]
# style_user = 'bold green'
# style_root = 'bold green'
# show_always = true
# format = '[$user]($style)@'
#
# [hostname]
# style = 'bold green'
# ssh_only = false
# ssh_symbol = ' '
# trim_at = ''
# format = '[$ssh_symbol$hostname]($style) '

[directory]
format = '[$path]($style) '
read_only = ' 󰌾'
truncation_length = 3

[character]
# success_symbol = '[\$](bold green)'
success_symbol = '[➔](bold green)'
error_symbol = '[✘](bold red)'
# vimcmd_symbol = '[➔](bold green)'

[git_branch]
# symbol = '   '
symbol = ' '
format = '[$symbol$branch(:$remote_branch)]($style) '

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
# options available for format
staged     = '+'
modified   = '!'
renamed    = '»'
deleted    = '-'
untracked  = '?'
stashed    = '≡'
conflicted = '✖'
ahead    = '↑${count}'
behind   = '↓${count}'
diverged = '↕${ahead_count}↓${behind_count}'

